# assistant_access.tools@1.0.0 (CD-FLSS-039 §3.3, §4.3; PLAN-FLSS-004 WP-C5, D-130, autonomous mode, for the owner's review).
# The tools an assistant may call. Each only reads; each returns only the fields at or below the token's tier (ST0 - ST2, and
# nothing above ST2 at any cap); none takes a sentence: an input is an id, a date or a small integer. ``first_tier`` is the
# lowest cap at which the tool returns anything. The functions that fill them are in tools.py; this file is what `tools/list`
# returns, and what the tests and H3's gate iterate over. A description is written for a model: literal and short.
version: "1.0.0"
instructions: "FLSS is one person's record of their own life areas, plans and time. These tools only read it. Each answer holds only what this token may see, and says how many fields were left out. Nothing here changes the record."
tools:
  - name: flss_today
    title: "Today"
    description: "How today stands: the date, how many areas and plans the person has and how many plans have a slot today. With a higher tier it adds whether the check-in is in, the capacity mode, each area's status and today's planned sessions by name."
    first_tier: 1
    inputSchema:
      type: object
      properties: {}
      additionalProperties: false
  - name: flss_areas
    title: "Areas"
    description: "The person's life areas. At the lowest tier only how many there are. With a higher tier each area's id, name, parent, kind, posture, season and status, so that other tools can be asked about one."
    first_tier: 1
    inputSchema:
      type: object
      properties: {}
      additionalProperties: false
  - name: flss_area
    title: "One area"
    description: "One area: its name, posture, season and status, its plan and its measures. Needs a tier that allows names and figures."
    first_tier: 2
    inputSchema:
      type: object
      properties:
        area_id: {type: string, pattern: "^[0-9a-fA-F-]{36}$", description: "An area's id, from flss_areas."}
      required: [area_id]
      additionalProperties: false
  - name: flss_measure
    title: "One measure"
    description: "One measure: its recent values by day in the person's own unit, the estimate for now, the projection to the end of its plan and its status. A measure whose numbers the person hid returns words only. Needs a tier that allows names and figures."
    first_tier: 2
    inputSchema:
      type: object
      properties:
        measure_id: {type: string, pattern: "^[0-9a-fA-F-]{36}$", description: "A measure's id, from flss_area."}
        days: {type: integer, minimum: 7, maximum: 90, default: 28, description: "How many recent days of values."}
      required: [measure_id]
      additionalProperties: false
  - name: flss_week_plan
    title: "The week's plan"
    description: "The week (Monday to Sunday) that holds the given day: for each day how many plans have a slot, and with a higher tier each plan's name, its area and the slot's label."
    first_tier: 1
    inputSchema:
      type: object
      properties:
        date: {type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", description: "Any day in the week, as YYYY-MM-DD. Today when left out."}
      additionalProperties: false
  - name: flss_day
    title: "What was done on a day"
    description: "What was done on a day, from the calendar, the activity tracker and the person's own entries: whether the day was covered and, with a higher tier, planned and actual minutes for each area, the share of time unplanned and the number of interruptions."
    first_tier: 1
    inputSchema:
      type: object
      properties:
        date: {type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$", description: "The day, as YYYY-MM-DD. Today when left out."}
      additionalProperties: false
